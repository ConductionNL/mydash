name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, beta, development]
  workflow_dispatch:

jobs:
  quality:
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: mydash
      php-version: "8.3"
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      # Hard gates added wave3.5: PHPUnit, Newman, Playwright. The
      # specs + collections already live under tests/ — flipping the
      # flags makes them required for merge into development / beta /
      # main per the org branch protection rules.
      enable-phpunit: true
      enable-newman: true
      enable-playwright: true
    secrets: inherit
