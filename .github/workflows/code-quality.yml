name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, beta, development]
  workflow_dispatch:

jobs:
  quality:
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: mydash
      php-version: "8.3"
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      # PHPUnit + Newman + Playwright stay disabled here for now —
      # see the wave3.5 follow-up note. Local runs of all three pass;
      # the shared `ConductionNL/.github` quality.yml runner needs
      # additional setup steps (occ app:enable mydash, fixture seed,
      # CSRF-aware login) before any of them can run green on a fresh
      # CI VM. Tracked separately so it doesn't block wave3 e2e
      # coverage from landing.
